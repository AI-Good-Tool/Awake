name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Test
        run: xcrun swift test
      - name: Check packaging scripts
        run: |
          for script in scripts/*.sh script/*.sh; do
            bash -n "${script}"
          done
